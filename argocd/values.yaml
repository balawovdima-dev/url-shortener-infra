# Values for the argo-cd Helm chart, installed by scripts/bootstrap-cluster.sh
# (chart version pinned there). Single small node: no HA, no SSO, no exposed UI.
# UI: kubectl -n argocd port-forward svc/argocd-server 8080:443
#     password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
dex:
  enabled: false
notifications:
  enabled: false
