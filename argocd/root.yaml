# The only Application applied by hand (by scripts/bootstrap-cluster.sh, once
# per cluster). It syncs apps/ from url-shortener-gitops, where every
# environment's Application lives: from here on, deploys are git pushes there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/balawovdima-dev/url-shortener-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
