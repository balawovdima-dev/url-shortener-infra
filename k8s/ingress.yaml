# Requires an ingress controller in the cluster (nginx-ingress or Traefik).
# The Ingress object alone does nothing — it's just rules for the controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener
  namespace: url-shortener
spec:
  ingressClassName: nginx # must match the installed controller
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: / # catch-all must come last
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
