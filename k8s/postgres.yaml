# LOCAL DEV ONLY. In AWS this is replaced by RDS — you then delete this file
# and only change the DATABASE_URL in 20-backend-config.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: url-shortener
type: Opaque
stringData: # stringData = plain text; Kubernetes base64-encodes it for you
  POSTGRES_USER: shortener
  POSTGRES_PASSWORD: localdevpassword
  POSTGRES_DB: shortener
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres # must match the pod labels below
  template:
    metadata:
      labels:
        app: postgres # the Service finds pods by this label
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres # injects all three keys as env vars
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shortener"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: url-shortener
spec:
  selector:
    app: postgres
  ports:
    - port: 5432 # the port the Service exposes
      targetPort: 5432 # the port the container listens on
