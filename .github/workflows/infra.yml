name: infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.3

jobs:
  terraform:
    name: terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, envs/dev, modules/vpc]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -diff -recursive
        working-directory: ${{ matrix.dir }}
      # No backend: validate needs providers only, never state or credentials.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits on the plugin download
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Terraform, the Helm chart (values from trivy.yaml) and argocd/ manifests.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
      - run: helm lint charts/url-shortener --set publicUrl=https://example.com
